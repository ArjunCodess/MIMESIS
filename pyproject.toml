[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mimesis-research"
version = "1.0.0"
description = "Reproducible Earth-Moon-Mars terrain analogue investigation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "pyproj>=3.7,<4", "Pillow>=11,<14", "tifffile>=2025.1", "imagecodecs>=2025.1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "requests>=2.32,<3", "matplotlib>=3.10,<4", "rasterio>=1.5,<2", "pyarrow>=26,<27", "osmium>=4.3,<5", "shapely>=2.1,<3", "pyogrio>=0.13,<1", "netCDF4>=1.7,<2", "h5py>=3.12,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
presentation = ["python-pptx>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
